<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {

  flex-direction: column;
  align-items: center;
  padding: 20px;
  direction: rtl;
}

h1 {
  color: #fff;
  font-size: 2.2rem;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
  margin-bottom: 4px;
}

.subtitle {
  color: #ffd700;
  font-size: 1.1rem;
  margin-bottom: 16px;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-bottom: 20px;
}

.unit-btn {
  padding: 10px 20px;
  border: 3px solid #fff;
  border-radius: 25px;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  backdrop-filter: blur(4px);
}

.unit-btn:hover { background: rgba(255,255,255,0.35); transform: scale(1.05); }
.unit-btn.active { background: #ffd700; color: #333; border-color: #ffd700; }
.unit-btn.practice-btn {
  border-color: #ff6b35;
  background: rgba(255,107,53,0.25);
  box-shadow: 0 0 12px rgba(255,107,53,0.6);
}
.unit-btn.practice-btn.active { background: #ff6b35; color: #fff; border-color: #ff6b35; }

.stats {
  display: flex;
  gap: 24px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  justify-content: center;
}

.stat {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(6px);
  padding: 8px 18px;
  border-radius: 16px;
  color: #fff;
  font-size: 1rem;
  font-weight: bold;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
}

.stat span { color: #ffd700; }

.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  max-width: 600px;
  width: 100%;
  perspective: 1000px;
  margin-bottom: 20px;
}

.card {
  aspect-ratio: 1 / 1.15;
  cursor: pointer;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s ease;
}

.card.flipped { transform: rotateY(180deg); }
.card.matched { pointer-events: none; }
.card.matched .card-front {
  background: linear-gradient(135deg, #00c853, #69f0ae) !important;
  box-shadow: 0 0 20px rgba(0,200,83,0.5);
}

.card-face {
  position: absolute;
  inset: 0;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  text-align: center;
  padding: 8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.card-back {
  background: linear-gradient(135deg, #6c5ce7, #a29bfe);
  font-size: 2.5rem;
  user-select: none;
}

.card-back::after { content: '?'; color: rgba(255,255,255,0.6); font-size: 2.8rem; font-weight: bold; }

.card-front {
  background: linear-gradient(135deg, #fff, #f0f0ff);
  transform: rotateY(180deg);
  color: #333;
  font-weight: bold;
  word-break: break-word;
  overflow-wrap: break-word;
}

.card-front.en { font-size: 1.3rem; font-family: 'Segoe UI', Tahoma, sans-serif; color: #4a00e0; }
.card-front.he { font-size: 1.25rem; color: #e91e63; }

.play-again {
  padding: 14px 36px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, #ffd700, #ff9800);
  color: #333;
  font-size: 1.3rem;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 15px rgba(255,152,0,0.4);
  display: none;
}

.play-again:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(255,152,0,0.6); }

/* Celebration overlay */
.celebration {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.celebration.show { display: flex; }

.celebration-box {
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 24px;
  padding: 40px 50px;
  text-align: center;
  color: #fff;
  box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  animation: popIn 0.6s ease;
}

@keyframes popIn {
  0% { transform: scale(0.3); opacity: 0; }
  60% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}

.celebration-box h2 { font-size: 2.2rem; margin-bottom: 10px; }
.celebration-box .emoji-row { font-size: 3rem; margin-bottom: 12px; }
.celebration-box p { font-size: 1.1rem; margin-bottom: 20px; opacity: 0.9; }

.celebration-box button {
  padding: 12px 32px;
  border: none;
  border-radius: 25px;
  background: #ffd700;
  color: #333;
  font-size: 1.2rem;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s;
}
.celebration-box button:hover { transform: scale(1.08); }

/* Confetti */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  z-index: 101;
  animation: confettiFall linear forwards;
  pointer-events: none;
}

@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
}

/* Mobile */
@media (max-width: 500px) {
  h1 { font-size: 1.5rem; }
  .subtitle { font-size: 0.9rem; }
  .board { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .card-front.en { font-size: 1rem; }
  .card-front.he { font-size: 1rem; }
  .card-back::after { font-size: 2rem; }
  .stat { font-size: 0.85rem; padding: 6px 12px; }
  .unit-btn { padding: 8px 14px; font-size: 0.85rem; }
  .stats { gap: 10px; }
}

@media (min-width: 501px) and (max-width: 768px) {
  .board { grid-template-columns: repeat(4, 1fr); max-width: 500px; }
}
.game-nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);

.game-nav a {

.game-nav a:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }

  unit2: "יחידה 2",
  unit3: "יחידה 3",
  all: "כל היחידות",
  practice: "🔥 תרגול טעויות"
};

const MISTAKES_KEY = 'engGameMistakes';
function getMistakes() {
  try { return JSON.parse(localStorage.getItem(MISTAKES_KEY) || '{}'); }
  catch(e) { return {}; }
}
function saveMistakes(m) { localStorage.setItem(MISTAKES_KEY, JSON.stringify(m)); }
function addMistake(en) {
  const m = getMistakes();
  m[en] = (m[en] || 0) + 1;
  saveMistakes(m);
}
function reduceMistake(en) {
  const m = getMistakes();
  if (m[en]) {
    m[en] = Math.max(0, m[en] - 1);
    if (m[en] === 0) delete m[en];
    saveMistakes(m);
  }
}
function getPracticeWords() {
  const m = getMistakes();
  const allWords = [...vocabulary.unit1, ...vocabulary.unit2, ...vocabulary.unit3];
  const seen = new Set();
  const dedupedAll = allWords.filter(w => {
    if (seen.has(w.en)) return false;
    seen.add(w.en);
    return true;
  });
  return Object.keys(m)
    .filter(k => m[k] > 0)
    .map(k => dedupedAll.find(w => w.en === k))
    .filter(Boolean);
}
function getPracticeCount() {
  return Object.values(getMistakes()).filter(c => c > 0).length;
}
function updatePracticeBadge() {
  document.querySelectorAll('.practice-count').forEach(el => {
    el.textContent = getPracticeCount();
  });
}

let currentUnit = "unit1";
let cards = [];
let flippedCards = [];
let matchesFound = 0;
let attempts = 0;
let timerInterval = null;
let seconds = 0;
let locked = false;

// Unit buttons
document.querySelectorAll('.unit-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.unit === 'practice' && getPracticeWords().length === 0) {
      alert('אין מספיק מילים לתרגול עדיין. שחק קצת ואני אזכור איפה טעית!');
      return;
    }
    document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentUnit = btn.dataset.unit;
    startGame();
  });
});

function getWords() {
  let pool;
  if (currentUnit === 'all') {
    pool = [...vocabulary.unit1, ...vocabulary.unit2, ...vocabulary.unit3];
  } else if (currentUnit === 'practice') {
    pool = getPracticeWords();
    if (pool.length < 6) {
      // Fill up with random words from all units
      const all = [...vocabulary.unit1, ...vocabulary.unit2, ...vocabulary.unit3];
      const have = new Set(pool.map(w => w.en));
      const filler = all.filter(w => !have.has(w.en));
      for (let i = filler.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [filler[i], filler[j]] = [filler[j], filler[i]];
      }
      pool = pool.concat(filler.slice(0, 6 - pool.length));
    }
  } else {
    pool = [...vocabulary[currentUnit]];
  }
  // Shuffle and pick 6
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 6);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame() {
  clearInterval(timerInterval);
  seconds = 0;
  matchesFound = 0;
  attempts = 0;
  flippedCards = [];
  locked = false;

  document.getElementById('matches').textContent = '0';
  document.getElementById('attempts').textContent = '0';
  document.getElementById('timer').textContent = '0:00';
  document.getElementById('playAgain').style.display = 'none';
  document.getElementById('subtitle').textContent = '⭐ ' + unitNames[currentUnit];

  const words = getWords();
  cards = [];

  words.forEach((w, i) => {
    cards.push({ id: i, type: 'en', text: w.en, pairId: i });
    cards.push({ id: i, type: 'he', text: w.he, pairId: i });
  });

  cards = shuffle(cards);

  const board = document.getElementById('board');
  board.innerHTML = '';

  cards.forEach((card, idx) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.index = idx;
    el.innerHTML = `
      <div class="card-face card-back"></div>
      <div class="card-face card-front ${card.type}">${card.text}</div>
    `;
    el.addEventListener('click', () => flipCard(idx, el));
    board.appendChild(el);
  });

  // Start timer
  timerInterval = setInterval(() => {
    seconds++;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    document.getElementById('timer').textContent = m + ':' + (s < 10 ? '0' : '') + s;
  }, 1000);
}

function flipCard(idx, el) {
  if (locked) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (flippedCards.length >= 2) return;

  el.classList.add('flipped');
  flippedCards.push({ idx, el, card: cards[idx] });

  if (flippedCards.length === 2) {
    attempts++;
    document.getElementById('attempts').textContent = attempts;
    checkMatch();
  }
}

function checkMatch() {
  const [a, b] = flippedCards;
  if (a.card.pairId === b.card.pairId && a.card.type !== b.card.type) {
    // Match!
    const enWord = a.card.type === 'en' ? a.card.text : b.card.text;
    reduceMistake(enWord);
    updatePracticeBadge();
    setTimeout(() => {
      a.el.classList.add('matched');
      b.el.classList.add('matched');
      matchesFound++;
      document.getElementById('matches').textContent = matchesFound;
      flippedCards = [];

      if (matchesFound === 6) {
        clearInterval(timerInterval);
        setTimeout(celebrate, 400);
      }
    }, 500);
  } else {
    // No match
    const getEn = (c) => {
      if (c.type === 'en') return c.text;
      // find pair en
      const pair = cards.find(x => x.pairId === c.pairId && x.type === 'en');
      return pair ? pair.text : null;
    };
    const enA = getEn(a.card);
    const enB = getEn(b.card);
    if (enA) addMistake(enA);
    if (enB && enB !== enA) addMistake(enB);
    updatePracticeBadge();
    locked = true;
    setTimeout(() => {
      a.el.classList.remove('flipped');
      b.el.classList.remove('flipped');
      flippedCards = [];
      locked = false;
    }, 900);
  }
}

function celebrate() {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  const timeStr = m + ':' + (s < 10 ? '0' : '') + s;
  document.getElementById('celebrationText').textContent =
    'מצאתם את כל 6 הזוגות ב-' + attempts + ' ניסיונות ובזמן של ' + timeStr + '!';
  document.getElementById('celebration').classList.add('show');
  spawnConfetti();
  document.getElementById('playAgain').style.display = 'inline-block';
}

function closeCelebration() {
  document.getElementById('celebration').classList.remove('show');
  startGame();
}

function spawnConfetti() {
  const colors = ['#ffd700', '#ff6b6b', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#00d2d3', '#ff9f43'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-10px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = (6 + Math.random() * 8) + 'px';
    c.style.height = (6 + Math.random() * 8) + 'px';
    c.style.animationDuration = (2 + Math.random() * 3) + 's';
    c.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

// Start the game on load
updatePracticeBadge();
startGame();
</script>
</body>
</html>
