<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>יאללה ערבית! — כיתה ז'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf4e6; --bg2:#f3e6cc; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e9dcc2;
  --teal:#0f766e; --teal2:#14b8a6; --gold:#f59e0b; --gold2:#fde68a; --red:#ef4444; --green:#16a34a; --green2:#dcfce7;
  --red2:#fee2e2; --purple:#7c3aed; --blue:#2563eb; --shadow:0 4px 0 rgba(0,0,0,.08), 0 8px 24px rgba(120,90,40,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Heebo",-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);
  background-image:radial-gradient(circle at 20% 0%,#fff7e0 0,transparent 40%),radial-gradient(circle at 100% 100%,#f1e2c2 0,transparent 45%);
  min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.ar{font-family:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic","Arial",serif;direction:rtl;unicode-bidi:isolate;line-height:1.6}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:84px}
body.ingame #app{padding-bottom:12px}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(251,244,230,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid var(--teal2);font-size:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pill{display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;padding:6px 10px;border-radius:999px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.pill.fire{color:#ea580c}.pill.gem{color:#0891b2}.pill.dim{opacity:.45;filter:grayscale(1)}
.lvl{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;align-items:stretch}
.lvl small{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:#eadfc8;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fb923c);border-radius:99px;transition:width .6s}
#main{flex:1;padding:14px}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;background:#fff;border-top:2px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav .in{display:flex;max-width:560px;width:100%;justify-content:space-around}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 6px;border-radius:12px;min-width:56px}
.nav button b{font-size:23px;line-height:1.1}
.nav button.on{color:var(--teal);background:#e6f6f3}
.nav .badge{position:absolute;margin:-4px 26px 0 0;background:var(--red);color:#fff;font-size:10px;border-radius:99px;padding:0 5px}
body.ingame .nav{display:none}
/* cards & buttons */
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:17px;padding:14px 18px;border-radius:16px;background:var(--teal);color:#fff;box-shadow:0 4px 0 #0b5c55;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0b5c55}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 #b45309}
.btn.purple{background:var(--purple);box-shadow:0 4px 0 #5b21b6}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #d6c8ab;border:2px solid var(--line)}
.btn.red{background:var(--red);box-shadow:0 4px 0 #b91c1c}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
h2{font-size:22px;font-weight:800;margin-bottom:6px}
h3{font-size:17px;font-weight:800;margin-bottom:8px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* mascot */
.mascot{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
.mascot .face{font-size:52px;animation:bob 2.4s ease-in-out infinite;flex-shrink:0}
.bubble{background:#fff;border-radius:18px 18px 18px 4px;padding:12px 14px;box-shadow:var(--shadow);font-weight:600;line-height:1.5;position:relative;flex:1}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
/* daily */
.daily{display:flex;gap:14px;align-items:center}
.ring{--p:0;width:74px;height:74px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--gold) calc(var(--p)*1%),#f1e7d2 0);display:flex;align-items:center;justify-content:center}
.ring>span{width:58px;height:58px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:14px;line-height:1.1}
.ring>span small{font-size:10px;color:var(--muted)}
.quest{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.quest:first-child{border-top:none}
.quest .qb{flex:1}
.quest .bar{height:7px;margin-top:3px}
.quest .bar>i{background:linear-gradient(90deg,var(--teal2),var(--teal))}
.claim{font-size:13px;padding:6px 10px;border-radius:10px;background:var(--gold);color:#fff;font-weight:800;box-shadow:0 3px 0 #b45309;animation:pulse 1s infinite}
.done-chip{font-size:12px;color:var(--green);font-weight:800}
@keyframes pulse{50%{transform:scale(1.08)}}
/* path */
.path{position:relative;padding:10px 0 30px}
.unitrow{display:flex;justify-content:center;margin:6px 0}
.node{position:relative;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;
  box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .1s}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.node.locked{background:#d9cfbd!important;filter:grayscale(.6);box-shadow:0 7px 0 #b9ad96}
.node .mring{position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--m)*1%),rgba(0,0,0,.07) 0);z-index:-1}
.node.current::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px dashed var(--teal2);animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nodewrap{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;z-index:1}
.nodelabel{font-size:13px;font-weight:800;text-align:center;max-width:170px;background:#fff;padding:3px 10px;border-radius:10px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.nodestars{font-size:14px;letter-spacing:1px;height:18px}
.month{font-size:11px;color:var(--muted);font-weight:700}
.start-tag{position:absolute;top:-30px;background:var(--teal);color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:10px;animation:bob2 1.4s infinite;white-space:nowrap}
@keyframes bob2{50%{transform:translateY(-5px)}}
.review-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 #5b21b6;margin-bottom:14px}
.review-btn b{font-size:34px}
/* unit screen */
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{font-size:22px;width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.unit-hero{border-radius:22px;padding:18px;color:#fff;margin-bottom:14px;box-shadow:var(--shadow)}
.unit-hero .big{font-size:44px}
.tips li{margin:6px 18px 6px 0;line-height:1.6}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{background:#fff;border-radius:18px;padding:14px 10px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent}
.act b{font-size:36px}
.act strong{font-size:16px}
.act small{color:var(--muted);font-size:12px;line-height:1.3}
.act.hero{grid-column:1/-1;flex-direction:row;justify-content:center;gap:14px;background:linear-gradient(135deg,#fff,#fff7e0);border-color:var(--gold2)}
/* learn */
.flash{text-align:center;padding:22px 16px;min-height:330px;display:flex;flex-direction:column;align-items:center;gap:10px;justify-content:center}
.flash .bigar{font-size:96px;line-height:1.3;color:var(--teal)}
.flash .midar{font-size:52px;line-height:1.5;color:var(--teal)}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.forms div{background:var(--bg);border-radius:12px;padding:6px 2px}
.forms .ar{font-size:34px;display:block;line-height:1.5}
.forms small{font-size:11px;color:var(--muted);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border-radius:14px;padding:8px 12px;font-weight:700}
.speak{width:48px;height:48px;border-radius:50%;background:var(--teal2);color:#fff;font-size:22px;box-shadow:0 3px 0 #0d9488;flex-shrink:0}
.speak.sm{width:36px;height:36px;font-size:16px}
.dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:#e2d5bb}
.dots i.on{background:var(--teal)}
/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qhead .bar{flex:1;height:14px}
.qhead .bar>i{background:linear-gradient(90deg,#22c55e,#16a34a)}
.hearts{font-size:18px;white-space:nowrap}
.combo{text-align:center;font-weight:800;color:#ea580c;height:24px;margin-bottom:4px;transition:transform .2s}
.combo.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.5)}}
.qprompt{text-align:center;margin-bottom:16px}
.qprompt .ask{font-weight:700;color:var(--muted);margin-bottom:8px;font-size:15px}
.qprompt .ar.q{font-size:68px;color:var(--teal);line-height:1.45}
.qprompt .ar.qs{font-size:44px;color:var(--teal);line-height:1.6}
.qprompt .heq{font-size:30px;font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 8px;font-weight:700;font-size:17px;min-height:68px;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .ar{font-size:34px;line-height:1.4}
.opt.ok{background:var(--green2);border-color:var(--green);box-shadow:0 4px 0 var(--green)}
.opt.bad{background:var(--red2);border-color:var(--red);box-shadow:0 4px 0 var(--red);animation:shake .4s}
.opt.dim{opacity:.5}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s}
.sheet.show{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.sheet.good{background:#dcfce7;border-top:3px solid #86efac}
.sheet.wrong{background:#fee2e2;border-top:3px solid #fca5a5}
.sheet .msg{font-weight:800;font-size:19px;margin-bottom:4px}
.sheet .sub{margin-bottom:12px;line-height:1.5}
.sheet.good .btn{background:var(--green);box-shadow:0 4px 0 #166534}
.slots{min-height:84px;border-bottom:3px solid var(--line);margin:4px 20px 16px;display:flex;align-items:center;justify-content:center;font-size:54px;color:var(--teal)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.tile{width:58px;height:62px;border-radius:14px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:32px}
.tile.used{opacity:.2;pointer-events:none}
.xpfloat{position:fixed;z-index:60;font-weight:800;color:var(--gold);font-size:26px;pointer-events:none;animation:float 1s forwards;text-shadow:0 2px 0 #fff}
@keyframes float{to{transform:translateY(-70px);opacity:0}}
/* results */
.result{text-align:center;padding-top:10px}
.bigstars{font-size:56px;letter-spacing:6px;margin:8px 0}
.bigstars span{display:inline-block;opacity:.18;filter:grayscale(1);transform:scale(.6);transition:all .4s cubic-bezier(.3,1.8,.5,1)}
.bigstars span.on{opacity:1;filter:none;transform:scale(1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:#fff;border-radius:16px;padding:10px 4px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px}
.stat small{font-size:12px;color:var(--muted);font-weight:700}
.chest{font-size:96px;display:inline-block;cursor:pointer;margin:10px 0}
.chest.shake{animation:cshake .5s 3}
@keyframes cshake{25%{transform:rotate(-12deg) scale(1.05)}75%{transform:rotate(12deg) scale(1.05)}}
.reward{font-size:24px;font-weight:800;animation:pop .5s}
/* games */
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:10px;gap:8px}
.timer{font-size:22px;color:var(--red)}
.tf-card{text-align:center;padding:28px 16px;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.tf-card .ar{font-size:64px;color:var(--teal);line-height:1.4}
.tf-card .he{font-size:26px;font-weight:800}
.field{position:relative;height:min(62vh,520px);border-radius:22px;background:linear-gradient(#bae6fd,#e0f2fe 60%,#fef3c7);overflow:hidden;box-shadow:inset 0 0 0 3px #93c5fd;touch-action:manipulation}
.drop{position:absolute;top:0;min-width:64px;height:64px;padding:0 10px;border-radius:32px;background:#fff;box-shadow:0 4px 0 #93c5fd;display:flex;align-items:center;justify-content:center;font-size:30px;color:#0f172a;will-change:transform}
.drop.hit{background:var(--green2);transform:scale(1.4)!important;opacity:0;transition:all .3s}
.drop.miss{background:var(--red2);animation:shake .4s}
.target{background:#fff;border-radius:16px;padding:8px 14px;text-align:center;box-shadow:var(--shadow);font-weight:800;font-size:20px;margin-bottom:10px}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mcard{aspect-ratio:3/3.4;border-radius:16px;perspective:600px}
.mcard .inner{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mcard.flip .inner{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.mcard .f{background:linear-gradient(135deg,var(--teal2),var(--teal));font-size:34px;color:#fff}
.mcard .b{background:#fff;transform:rotateY(180deg);font-weight:800;font-size:15px;border:3px solid var(--line)}
.mcard .b .ar{font-size:30px}
.mcard.matched .b{background:var(--green2);border-color:var(--green)}
/* badges & shop */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.badge b{font-size:34px;display:block}
.badge strong{font-size:13px;display:block}
.badge small{font-size:11px;color:var(--muted);line-height:1.2;display:block;margin-top:2px}
.badge.off{opacity:.45;filter:grayscale(1)}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sitem{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;box-shadow:var(--shadow);border:3px solid transparent}
.sitem b{font-size:40px;display:block}
.sitem.sel{border-color:var(--teal2)}
.sitem small{font-weight:800;font-size:13px}
/* dictionary */
.seg{display:flex;background:#efe3cb;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--teal);box-shadow:0 2px 0 rgba(0,0,0,.06)}
.abc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.abc button{background:#fff;border-radius:14px;padding:6px 2px;box-shadow:var(--shadow)}
.abc .ar{font-size:38px;display:block;color:var(--teal);line-height:1.4}
.abc small{font-size:11px;font-weight:700;color:var(--muted)}
.wl{width:100%;border-collapse:collapse}
.wl td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.wl .ar{font-size:24px;color:var(--teal)}
.wl .tr{color:var(--muted);font-size:13px}
.timeline{border-right:3px solid var(--teal2);padding-right:14px;margin-right:6px}
.timeline div{margin-bottom:12px;position:relative}
.timeline div::before{content:"";position:absolute;right:-22px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--teal2);border:3px solid var(--bg)}
.timeline b{color:var(--teal)}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:70;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--bg);border-radius:24px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .3s}
.field-l{display:block;font-weight:800;margin:12px 0 6px}
.inp{width:100%;font-family:inherit;font-size:18px;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fff}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{flex:1;min-width:80px;padding:11px 8px;border-radius:14px;background:#fff;border:3px solid var(--line);font-weight:800;font-size:15px}
.choice button.on{border-color:var(--teal2);background:#e6f6f3;color:var(--teal)}
.toasts{position:fixed;top:12px;left:0;right:0;z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:#1f2937;color:#fff;font-weight:700;padding:12px 18px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .35s;max-width:480px;text-align:center}
.toast.gold{background:linear-gradient(135deg,#f59e0b,#ea580c)}
@keyframes tin{from{transform:translateY(-40px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95}
.center{text-align:center}
.sp{height:10px}
.note{font-size:13px;line-height:1.6;color:var(--muted)}
.note a{color:var(--teal)}
@media (max-width:380px){.qprompt .ar.q{font-size:56px}.opt .ar{font-size:28px}.node{width:80px;height:80px;font-size:32px}.tile{width:50px;height:56px;font-size:28px}}
</style>
</head>
<body>
<div id="app">
  <div class="top" id="top"></div>
  <div id="main"></div>
</div>
<nav class="nav"><div class="in" id="nav"></div></nav>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toasts" id="toasts"></div>
<canvas id="confetti"></canvas>
<div id="modalRoot"></div>

<script>
/* =====================================================================
   יאללה ערבית! — אפליקציה ללימוד ערבית לכיתה ז' (בית ספר דובר עברית)
   הכל בקובץ אחד, בלי תלויות. ההתקדמות נשמרת ב-localStorage במכשיר.
   ===================================================================== */

/* ---------------- DATA: 28 האותיות ---------------- */
// [אות, שם בעברית, מקבילה, שם בערבית (להקראה), תעתיק לטיני, משפחת צורה, יחידה, מילה לדוגמה, טיפ]
const LETTER_DATA = [
 ["ا","אַלִף","א","أَلِف","a / ā","",1,"أَسَد|אריה|אַסַד","לא מתחברת לאות שאחריה. משמשת גם כתנועת a ארוכה."],

/* ---------------- build items ---------------- */
const TATWEEL = "\u0640";
const NONJOIN = "اأإآدذرزوؤة";
const LETTERS = {};
LETTER_DATA.forEach(([ar,name,heb,arName,lat,fam,unit,word,tip])=>{
  const [war,whe,wtr] = word.split("|");
  LETTERS[ar] = {id:"l:"+ar, type:"letter", ar, name, heb, he:`${name} (${heb})`, tr:heb, arName, lat, fam, unit, word:{ar:war,he:whe,tr:wtr}, tip, say:arName};
});
const ITEMS = {}; // id -> item (shared across units)
function reg(it){ if(!ITEMS[it.id]) ITEMS[it.id]=it; return ITEMS[it.id]; }
UNITS.forEach(u=>{
  u.items=[];
  if(u.letters) u.letters.split(" ").forEach(ch=>u.items.push(reg(LETTERS[ch])));
  (u.signs||[]).forEach(s=>{const [ar,he,sm]=s.split("|"); u.items.push(reg({id:"s:"+ar,type:"sign",ar,he,tr:he,sm:sm||null,say:ar}));});
  (u.words||[]).forEach(s=>{const [ar,he,tr]=s.split("|"); u.items.push(reg({id:"w:"+ar+":"+he,type:"word",ar,he,tr,say:ar}));});
  (u.phrases||[]).forEach(s=>{const [ar,he,tr]=s.split("|"); u.items.push(reg({id:"p:"+ar,type:"phrase",ar,he,tr,say:ar}));});
  (u.digits||[]).forEach(s=>{const [ar,he]=s.split("|"); u.items.push(reg({id:"d:"+ar,type:"digit",ar,he,tr:he,say:ar}));});
});
const ALL_ITEMS = Object.values(ITEMS);

/* ---------------- helpers ---------------- */
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const strip=s=>s.replace(/[\u064B-\u0652\u0670\u0640]/g,"");
const group=t=>(t==="word"||t==="phrase")?"lex":t;
function dstr(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
const today=()=>dstr(new Date());
function dayDiff(a,b){const p=a.split("-").map(Number),q=b.split("-").map(Number);return Math.round((new Date(q[0],q[1]-1,q[2])-new Date(p[0],p[1]-1,p[2]))/864e5)}
function formsOf(ch){ if(NONJOIN.includes(ch)) return {iso:ch,ini:ch,med:TATWEEL+ch,fin:TATWEEL+ch};
  return {iso:ch,ini:ch+TATWEEL,med:TATWEEL+ch+TATWEEL,fin:TATWEEL+ch}; }
const FORM_NAMES={iso:"בודדת",ini:"בתחילת מילה",med:"באמצע מילה",fin:"בסוף מילה"};

/* ---------------- state ---------------- */
const KEY="yallaArabic_v1";
const DEF={onboarded:false,name:"",gender:"f",goal:50,sound:true,xp:0,gems:30,streak:0,best:0,last:null,freezes:0,avatar:"🐪",owned:["🐪"],
  unlocked:1,unitStars:{},learnDone:{},games:{},mastery:{},ach:{},totals:{lessons:0,correct:0,chests:0,reviews:0,perfect:0,maxcombo:0},day:null,dxpUntil:0};
let S;
function load(){ let saved={}; try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}
  S=Object.assign(JSON.parse(JSON.stringify(DEF)),saved); S.totals=Object.assign({},DEF.totals,S.totals||{}); }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
function G(f,m){return S.gender==="m"?m:f}

function ensureDay(){ if(!S.day||S.day.date!==today()) S.day={date:today(),xp:0,lessons:0,correct:0,maxcombo:0,speed:0,review:0,perfect:0,memory:0,rain:0,claimed:[],goalDone:false,allBonus:false}; }
function checkStreak(){
  if(!S.last) return; const g=dayDiff(S.last,today()); if(g<=1) return;
  const missed=g-1;
  if(S.streak>0 && S.freezes>=missed){ S.freezes-=missed; const y=new Date(); y.setDate(y.getDate()-1); S.last=dstr(y); setTimeout(()=>toast(`❄️ הקפאת רצף הצילה את הרצף שלך (${S.streak} ימים)!`),800); }
  else if(S.streak>0){ setTimeout(()=>toast("💔 הרצף התאפס… מתחילים רצף חדש היום!"),800); S.streak=0; }
  save();
}

const TITLES=[["צעד ראשון","צעד ראשון"],["חוקרת אותיות","חוקר אותיות"],["קוראת הברות","קורא הברות"],["ציידת מילים","צייד מילים"],["רוכבת גמלים","רוכב גמלים"],["מגלת נווה מדבר","מגלה נווה מדבר"],["מנווטת כוכבים","מנווט כוכבים"],["אמנית השפה","אמן השפה"],["אלופת הערבית","אלוף הערבית"],["אגדה","אגדה"]];
const TITLE_ICONS=["🌱","🔍","📖","🏹","🐪","🌴","✨","🎨","🏆","👑"];
function level(xp){let l=1;while(xp>=25*l*(l+1))l++;return l}
function lvlStart(l){return l===1?0:25*(l-1)*l}
function lvlTitle(l){const i=Math.min(l-1,TITLES.length-1);return TITLE_ICONS[i]+" "+G(TITLES[i][0],TITLES[i][1])}

/* ---------------- sound / speech / fx ---------------- */
let AC=null;
function tone(fs,dur=.12,type="sine",gap=.09,vol=.15){ if(!S.sound) return; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+.01;
  fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const s=t0+i*gap;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.015);g.gain.exponentialRampToValueAtTime(.0001,s+dur);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+dur+.03)})}catch(e){} }
const SFX={ok:()=>tone([659,988],.14,"sine",.08,.16),bad:()=>tone([220,165],.2,"square",.12,.06),combo:()=>tone([523,659,784,1047],.12,"triangle",.06,.14),
  lvl:()=>tone([523,659,784,1047,1319,1568],.22,"triangle",.1,.14),chest:()=>tone([880,1175,1568,2093,2637],.12,"sine",.05,.12),tap:()=>tone([520],.05,"sine",.05,.08),end:()=>tone([392,523,659,784],.2,"triangle",.12,.13)};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
let arVoice=null;
function loadVoices(){ try{const vs=speechSynthesis.getVoices();arVoice=vs.find(v=>/^ar[-_]?/i.test(v.lang))||null;}catch(e){} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
const voiceOK=()=>!!arVoice;
function speak(text){ if(!("speechSynthesis" in window)) return; try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=arVoice?arVoice.lang:"ar-SA";if(arVoice)u.voice=arVoice;u.rate=.75;speechSynthesis.speak(u)}catch(e){} }
function sayBtn(text,cls=""){ return `<button class="speak ${cls}" onclick="event.stopPropagation();speak('${text.replace(/'/g,"\\'")}')" title="הקראה">🔊</button>`; }

const cv=document.getElementById("confetti"),cx=cv.getContext("2d");let parts=[],confRAF=null;
function confetti(n=120){ cv.width=innerWidth;cv.height=innerHeight;const cols=["#f59e0b","#10b981","#ef4444","#3b82f6","#a855f7","#ec4899","#fde047"];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4,life:120+Math.random()*60});
  if(!confRAF) confRAF=requestAnimationFrame(confStep); }
function confStep(){ cx.clearRect(0,0,cv.width,cv.height); parts=parts.filter(p=>p.life-->0&&p.y<cv.height+20);
  parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
  confRAF=parts.length?requestAnimationFrame(confStep):(cx.clearRect(0,0,cv.width,cv.height),null); }
function toast(msg,cls=""){ const t=document.createElement("div");t.className="toast "+cls;t.innerHTML=msg;document.getElementById("toasts").appendChild(t);setTimeout(()=>{t.style.transition="opacity .4s";t.style.opacity=0;setTimeout(()=>t.remove(),400)},2800); }
function floatXP(n,el){ const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0};const f=document.createElement("div");f.className="xpfloat";f.textContent="+"+n+" XP";f.style.left=(r.left+r.width/2-40)+"px";f.style.top=(r.top-10)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1000); }

/* ---------------- XP / rewards ---------------- */
function addXP(n,el){
  ensureDay(); if(Date.now()<S.dxpUntil) n*=2;
  const before=level(S.xp); S.xp+=n; S.day.xp+=n;
  if(S.last!==today()){ S.streak=(S.last&&dayDiff(S.last,today())===1)?S.streak+1:1; S.last=today(); S.best=Math.max(S.best,S.streak);
    toast(`🔥 ${S.streak===1?"התחלת רצף חדש!":"רצף של "+S.streak+" ימים!"}`,"gold"); }
  if(!S.day.goalDone&&S.day.xp>=S.goal){ S.day.goalDone=true; S.gems+=15; setTimeout(()=>{toast("🎯 היעד היומי הושג! +15 💎","gold");confetti(80);SFX.combo()},400); }
  const after=level(S.xp); if(after>before) setTimeout(()=>levelUp(after),600);
  if(el) floatXP(n,el);
  checkAch(); save(); renderTop(); return n;
}
function levelUp(l){ SFX.lvl(); confetti(200); buzz([60,40,60]); S.gems+=10; save(); renderTop();
  modal(`<div class="center"><div style="font-size:70px">🎉</div><h2>עלית לשלב ${l}!</h2><p style="font-size:20px;font-weight:800;margin:8px 0">${lvlTitle(l)}</p><p class="muted">קיבלת 10 💎 מתנה</p><div class="sp"></div><button class="btn block" onclick="closeModal()">יאללה ממשיכים!</button></div>`); }

const QUEST_POOL=[
 {id:"lessons",t:"סיימו 2 תרגולים",n:2,k:"lessons"},{id:"correct",t:"ענו נכון על 30 שאלות",n:30,k:"correct"},{id:"combo",t:"הגיעו לקומבו של 8",n:8,k:"maxcombo"},
 {id:"speed",t:"השיגו 15 בריצת בזק",n:15,k:"speed"},{id:"review",t:"השלימו חזרה חכמה",n:1,k:"review"},{id:"perfect",t:"תרגול בלי אף טעות",n:1,k:"perfect"},
 {id:"memory",t:"נצחו במשחק זיכרון",n:1,k:"memory"},{id:"rain",t:"תפסו 15 בגשם מילים",n:15,k:"rain"},{id:"xp",t:"צברו 80 XP היום",n:80,k:"xp"}];
function dailyQuests(){ ensureDay(); const d=S.day.date; let h=0; for(const c of d) h=(h*31+c.charCodeAt(0))>>>0;
  const pool=[...QUEST_POOL], out=[]; while(out.length<3){ h=(h*1103515245+12345)>>>0; out.push(pool.splice(h%pool.length,1)[0]); } return out; }
function claimQuest(id){ ensureDay(); const q=dailyQuests().find(x=>x.id===id); if(!q||S.day.claimed.includes(id)||(S.day[q.k]||0)<q.n) return;
  S.day.claimed.push(id); S.gems+=20; SFX.chest(); toast("✅ משימה הושלמה! +20 💎","gold");
  if(S.day.claimed.length===3&&!S.day.allBonus){ S.day.allBonus=true; save(); setTimeout(()=>chestModal("כל המשימות היומיות הושלמו!"),700); }
  save(); renderTop(); route(); }

function rollChest(){
  const r=Math.random();
  if(r<.03){ S.gems+=100; return "💰 ג'קפוט! 100 💎"; }
  if(r<.10&&S.freezes<2){ S.freezes++; return "❄️ הקפאת רצף! (שומרת על הרצף אם מפספסים יום)"; }
  if(r<.18){ S.dxpUntil=Math.max(Date.now(),S.dxpUntil)+15*60e3; return "⚡ XP כפול ל-15 דקות!"; }
  if(r<.30){ const g=40; S.gems+=g; return `💎 ${g} יהלומים!`; }
  if(r<.42){ addXP(25); return "⭐ 25 XP בונוס!"; }

/* ---------------- spaced repetition ---------------- */
const BOX_DELAY=[0,10*60e3,864e5,3*864e5,7*864e5,16*864e5];
function rec(it,ok){ const m=S.mastery[it.id]||{b:0,due:0,c:0,w:0}; if(ok){m.b=Math.min(5,m.b+1);m.c++}else{m.b=Math.max(0,m.b-2);m.w++} m.due=Date.now()+BOX_DELAY[m.b]; S.mastery[it.id]=m; }
const box=it=>(S.mastery[it.id]||{b:0}).b;
function mastery(u){ return u.items.reduce((s,it)=>s+box(it),0)/(5*u.items.length); }
function unlockedItems(){ const ids=new Set(), out=[]; UNITS.filter(u=>u.n<=S.unlocked).forEach(u=>u.items.forEach(it=>{if(!ids.has(it.id)){ids.add(it.id);out.push(it)}})); return out; }
function dueItems(){ const now=Date.now(); return unlockedItems().filter(it=>S.mastery[it.id]&&S.mastery[it.id].due<=now&&S.mastery[it.id].b<5); }

/* ---------------- question engine ---------------- */
const spellable=it=>it.type==="word"&&!/[\s؟]/.test(it.ar)&&Array.from(strip(it.ar)).length>=2&&Array.from(strip(it.ar)).length<=6;
function kindsFor(it){
  const k=[];
  if(it.type==="letter") k.push("ar2he","he2ar","form","he2ar","form");
  else if(it.type==="sign"){ k.push("ar2he","he2ar"); if(it.sm) k.push("sunmoon","sunmoon"); }
  else if(it.type==="digit") k.push("ar2he","he2ar");
  else { k.push("ar2he","he2ar"); if(it.type==="word"){ k.push("tr"); if(spellable(it)) k.push("spell","spell"); } }
  if(voiceOK()&&it.type!=="digit") k.push("listen");
  return k;
}
function distract(it,key,pool,n=3){
  const seen=new Set([it[key]]), out=[];
  const add=arr=>{ for(const x of arr){ if(out.length>=n) break; if(!seen.has(x[key])&&group(x.type)===group(it.type)){ seen.add(x[key]); out.push(x);} } };
  if(it.type==="letter"&&it.fam) add(shuffle(Object.values(LETTERS).filter(x=>x.fam===it.fam)));
  add(shuffle(pool)); add(shuffle(ALL_ITEMS));
  return out;
}
function makeQ(it,pool,kind){
  kind=kind||pick(kindsFor(it)); const q={it,kind};
  if(kind==="ar2he"){ q.opts=shuffle([it,...distract(it,"he",pool)]); q.show="he"; }
  else if(kind==="he2ar"||kind==="listen"){ q.opts=shuffle([it,...distract(it,"ar",pool)]); q.show="ar"; }
  else if(kind==="tr"){ q.opts=shuffle([it,...distract(it,"tr",pool)]); q.show="tr"; }
  else if(kind==="form"){ const f=formsOf(it.ar); const keys=NONJOIN.includes(it.ar)?["iso","fin"]:["ini","med","fin","iso"]; q.fk=pick(keys); q.ftext=f[q.fk]; q.opts=shuffle([it,...distract(it,"he",pool)]); q.show="he"; }
  else if(kind==="sunmoon"){ q.opts=["sun","moon"]; }
  else if(kind==="spell"){ const letters=Array.from(strip(it.ar)); const extra=shuffle(Object.keys(LETTERS).filter(c=>!letters.includes(c))).slice(0,2);
    q.target=letters; q.tiles=shuffle([...letters,...extra]); q.built=[]; }
  return q;
}
function buildLesson(items,n){
  // prioritize weaker items, but keep variety
  const sorted=shuffle(items).sort((a,b)=>(box(a)+Math.random()*2)-(box(b)+Math.random()*2));
  const chosen=[]; let i=0; while(chosen.length<n){ chosen.push(sorted[i%sorted.length]); i++; }
  return shuffle(chosen).map(it=>makeQ(it,items));
}

}

  }

  main().innerHTML=`<div class="result"><h2 style="font-size:28px">${title}</h2>

   <div class="stats"><div class="stat"><b>+${o.xp}</b><small>XP</small></div><div class="stat"><b>${acc}%</b><small>דיוק</small></div><div class="stat"><b>🔥${o.maxcombo}</b><small>קומבו שיא</small></div></div>
   ${extra}${chest?`<div class="card">${chestHTML()}</div>`:""}
   <div class="row"><button class="btn ghost" style="flex:1" onclick="${back}">${o.mode==="review"?"למפה":"ליחידה"}</button><button class="btn" style="flex:1" onclick="${again}">🔁 עוד סיבוב</button></div></div>`;
  hideSheet(); Q=null;
  if(win) [1,2,3].forEach(k=>setTimeout(()=>{const e=document.getElementById("st"+k);if(e&&k<=stars){e.classList.add("on");SFX.tap();}},400+k*350));

function rainGo(n){
  const items=UNITS[n-1].items.filter(it=>Array.from(it.ar).length<=12);
  GM={type:"rain",n,items,score:0,lives:3,time:60,drops:[],target:pick(items),last:performance.now(),spawn:0,elapsed:0};
  main().innerHTML=`<div class="hud"><button class="back" onclick="go({tab:'map',unit:${n}})">✕</button><span>⏱️ <span class="timer" id="tm">60</span></span><span id="rsc">✅ 0</span><span id="rlv">❤️❤️❤️</span></div>
   <div class="target" id="rtg"></div><div class="field" id="field"></div>`;
  rainTarget(GM.target); GM.raf=requestAnimationFrame(rainLoop);
}
function rainTarget(it){ GM.target=it; const t=document.getElementById("rtg"); if(t) t.innerHTML=`🎯 ${G("תפסי","תפוס")}: ${it.he}`; }
function rainLoop(ts){
  if(!GM||GM.type!=="rain"||GM.dead) return; const dt=Math.min(50,ts-GM.last); GM.last=ts; GM.elapsed+=dt; GM.time=60-GM.elapsed/1000;
  const f=document.getElementById("field"); if(!f) return; const H=f.clientHeight, W=f.clientWidth;
  const tm=document.getElementById("tm"); if(tm) tm.textContent=Math.max(0,Math.ceil(GM.time));
  const lvl=GM.elapsed/60000; const every=1150-lvl*600, speed=.07+lvl*.09;
  GM.spawn-=dt; if(GM.spawn<=0){ GM.spawn=every;
    const isT=Math.random()<.42 || !GM.drops.some(d=>d.it===GM.target); const it=isT?GM.target:(distract(GM.target,"ar",GM.items,1)[0]||GM.target);
    const el=document.createElement("button"); el.className="drop ar"; el.textContent=it.ar; f.appendChild(el);
    const w=el.offsetWidth; const x=Math.random()*(W-w-8)+4; const d={el,it,x,y:-70,v:speed*(0.85+Math.random()*.3)}; el.style.left=x+"px";
    el.onpointerdown=(e)=>{e.preventDefault();rainHit(d)}; GM.drops.push(d); }
  GM.drops.forEach(d=>{ if(d.gone) return; d.y+=d.v*dt; d.el.style.transform=`translateY(${d.y}px)`;
    if(d.y>H){ d.gone=true; d.el.remove(); if(d.it===GM.target){ rainLose(); } } });
  GM.drops=GM.drops.filter(d=>!d.gone);

  GM.raf=requestAnimationFrame(rainLoop);
}
function rainHit(d){ if(!GM||d.gone) return;
  if(d.it===GM.target){ d.gone=true; d.el.classList.add("hit"); setTimeout(()=>d.el.remove(),300); GM.score++; SFX.ok(); buzz(20); ensureDay(); rec(d.it,true); addXP(3); S.day.rain++;
    document.getElementById("rsc").textContent="✅ "+GM.score; if(voiceOK()) speak(d.it.say);
    const others=GM.items.filter(x=>x!==GM.target); rainTarget(pick(others.length?others:GM.items)); }
  else { d.el.classList.add("miss"); rec(GM.target,false); rainLose(); }
}
function rainLose(){ GM.lives--; SFX.bad(); buzz(80); const l=document.getElementById("rlv"); if(l) l.textContent="❤️".repeat(Math.max(0,GM.lives))+"🤍".repeat(3-Math.max(0,GM.lives)); }

  main().innerHTML=`<div class="result"><div style="font-size:64px">🌧️</div><h2>${rec_&&sc>0?"🏆 שיא חדש!":"המשחק נגמר!"}</h2><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><b>${sc}</b><small>תפיסות</small></div><div class="stat"><b>${Math.max(prev,sc)}</b><small>השיא שלך</small></div></div>
   ${sc>=10?`<div class="card">${chestHTML()}</div>`:`<p class="muted">10 תפיסות ומעלה = תיבת הפתעה 🎁</p>`}
   <div class="row"><button class="btn ghost" style="flex:1" onclick="go({tab:'map',unit:${n}})">ליחידה</button><button class="btn gold" style="flex:1" onclick="rainGo(${n})">🔁 שוב!</button></div></div>`;
}

  for(const it of pool){ if(chosen.length>=6) break; if(!hs.has(it.he)&&Array.from(it.ar).length<=14){hs.add(it.he);chosen.push(it)} }
  const cards=shuffle(chosen.flatMap(it=>[{it,face:"ar"},{it,face:"he"}]));
  GM={type:"memory",n,cards,open:[],moves:0,matched:0,lock:false,t0:Date.now()}; renderMemory();

function renderMemory(){
  main().innerHTML=`<div class="hud"><button class="back" onclick="go({tab:'map',unit:${GM.n}})">✕</button><span>🃏 זיכרון</span><span>מהלכים: <b id="mv">${GM.moves}</b></span></div>

function memFlip(i){
  if(!GM||GM.lock) return; const c=GM.cards[i]; if(c.done||GM.open.includes(i)) return;
  document.getElementById("mc"+i).classList.add("flip"); SFX.tap(); if(c.face==="ar"&&voiceOK()) speak(c.it.say);
  GM.open.push(i);
  if(GM.open.length===2){ GM.moves++; document.getElementById("mv").textContent=GM.moves; const [a,b]=GM.open.map(k=>GM.cards[k]);
    if(a.it===b.it){ a.done=b.done=true; GM.matched++; GM.open.forEach(k=>document.getElementById("mc"+k).classList.add("matched")); GM.open=[]; SFX.ok(); rec(a.it,true); addXP(4);
      if(GM.matched===6) setTimeout(memEnd,600); }
    else { GM.lock=true; SFX.bad(); setTimeout(()=>{ if(!GM||GM.type!=="memory") return; GM.open.forEach(k=>document.getElementById("mc"+k)?.classList.remove("flip")); GM.open=[]; GM.lock=false; },900); }
  }
}
function memEnd(){
  const n=GM.n, mv=GM.moves, secs=Math.round((Date.now()-GM.t0)/1000); GM=null; ensureDay();
  const stars=mv<=9?3:mv<=13?2:1; const key="mm"+n, prev=S.games[key], rec_=!prev||mv<prev; if(rec_) S.games[key]=mv;
  S.games.memBest=Math.min(S.games.memBest||99,mv); S.day.memory++; addXP(10+stars*5);
  checkAch(); save(); SFX.end(); confetti(stars*60);
  main().innerHTML=`<div class="result"><h2>${rec_?"🏆 שיא חדש!":"ניצחון! 🎉"}</h2><div class="bigstars">${[1,2,3].map(k=>`<span class="${k<=stars?"on":""}">⭐</span>`).join("")}</div>
   <div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><b>${mv}</b><small>מהלכים</small></div><div class="stat"><b>${secs}״</b><small>זמן</small></div></div>
   <div class="card">${chestHTML()}</div>
   <div class="row"><button class="btn ghost" style="flex:1" onclick="go({tab:'map',unit:${n}})">ליחידה</button><button class="btn gold" style="flex:1" onclick="startMemory(${n})">🔁 שוב!</button></div></div>`;
}

function buy(k){ if(k==="freeze"&&S.gems>=60&&S.freezes<2){S.gems-=60;S.freezes++;toast("❄️ נקנתה הקפאת רצף!");}
  if(k==="dxp"&&S.gems>=80){S.gems-=80;S.dxpUntil=Math.max(Date.now(),S.dxpUntil)+15*60e3;toast("⚡ XP כפול הופעל ל-15 דקות!","gold");confetti(60);}
  SFX.chest(); save(); route(); }
function buyAvatar(a,c){ if(S.owned.includes(a)){S.avatar=a;SFX.tap();save();route();return}
  if(S.gems<c){toast(`חסרים לך ${c-S.gems} 💎`);SFX.bad();return}
  S.gems-=c; S.owned.push(a); S.avatar=a; SFX.chest(); confetti(100); toast(`${a} ${G("הצטרפה","הצטרף")} אלייך!`.replace("אלייך",G("אלייך","אליך")),"gold"); save(); route(); }

/* ----- MODAL / SETTINGS / ONBOARDING ----- */
function modal(html){ document.getElementById("modalRoot").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box">${html}</div></div>`; }
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }
function settings(){
  modal(`<h2>⚙️ הגדרות</h2>
   <label class="field-l">שם</label><input class="inp" id="sName" value="${S.name.replace(/"/g,"")}" maxlength="20">

   <label class="field-l">יעד יומי</label><div class="choice">${[[30,"קליל"],[50,"רגיל"],[80,"רציני"],[120,"אלוף"]].map(([g,t])=>`<button class="${S.goal===g?"on":""}" onclick="S.goal=${g};save();settings()">${t}<br><small>${g} XP</small></button>`).join("")}</div>
   <label class="field-l">צלילים</label><div class="choice"><button class="${S.sound?"on":""}" onclick="S.sound=true;save();settings()">🔊 פועל</button><button class="${!S.sound?"on":""}" onclick="S.sound=false;save();settings()">🔇 כבוי</button></div>
   <p class="note" style="margin-top:10px">🗣️ הקראה בערבית: ${voiceOK()?`✅ זמינה (${arVoice.name})`:"❌ לא נמצא קול ערבי במכשיר. בטלפון/מחשב אפשר להוסיף קול ערבי בהגדרות הנגישות / ההקראה של המערכת."}</p>
   <label class="field-l">👨‍👩‍👧 מצב הורה</label>
   <div class="choice"><button onclick="if(confirm('לפתוח את כל 11 היחידות?')){S.unlocked=${UNITS.length};save();closeModal();route();toast('🔓 כל היחידות פתוחות')}">🔓 פתיחת כל היחידות</button>
   <button onclick="if(confirm('למחוק את כל ההתקדמות? אי אפשר לבטל!')){try{localStorage.removeItem(KEY)}catch(e){};location.reload()}" style="color:var(--red)">🗑️ איפוס</button></div>
   <div class="sp"></div><button class="btn block" onclick="S.name=document.getElementById('sName').value.trim();save();closeModal();route()">שמירה</button>`);
}
function onboarding(step=0,data={gender:"f",goal:50,start:1}){
  window._ob=data;
  if(step===0) modal(`<div class="center"><div style="font-size:80px;animation:bob 2s infinite">🐪</div><h2>أَهْلًا وَسَهْلًا!</h2><p style="font-size:18px;margin-bottom:6px">ברוכים הבאים ל<b>יאללה ערבית!</b></p>
    <p class="muted" style="line-height:1.6">מסע של שנה שלמה בערבית של כיתה ז' – מהאות הראשונה ועד שיחה בסיסית. עם משחקים, תיבות הפתעה, רצפים והישגים 🎁🔥🏆</p><div class="sp"></div>
    <button class="btn block" onclick="onboarding(1,_ob)">יאללה, מתחילים! ←</button></div>`);
  if(step===1) modal(`<h2>נעים להכיר! 👋</h2><label class="field-l">מה השם שלך?</label><input class="inp" id="obName" maxlength="20" placeholder="השם שלך" value="${data.name||""}">
    <label class="field-l">איך לפנות אליך?</label><div class="choice"><button class="${data.gender==="f"?"on":""}" onclick="_ob.name=obName.value;_ob.gender='f';onboarding(1,_ob)">בת 👧</button><button class="${data.gender==="m"?"on":""}" onclick="_ob.name=obName.value;_ob.gender='m';onboarding(1,_ob)">בן 👦</button></div>
    <label class="field-l">כמה לתרגל כל יום?</label><div class="choice">${[[30,"קליל","~5 דק׳"],[50,"רגיל","~10 דק׳"],[80,"רציני","~15 דק׳"]].map(([g,t,m])=>`<button class="${data.goal===g?"on":""}" onclick="_ob.name=obName.value;_ob.goal=${g};onboarding(1,_ob)">${t}<br><small>${m}</small></button>`).join("")}</div>
    <div class="sp"></div><button class="btn block" onclick="_ob.name=obName.value;onboarding(2,_ob)">הבא ←</button>`);
  if(step===2) modal(`<h2>איפה ${data.gender==="m"?"אתה":"את"} בכיתה? 📍</h2><p class="muted" style="margin-bottom:10px">כדי לא להתחיל מאפס אם כבר למדתם חלק.</p>
    <div style="display:flex;flex-direction:column;gap:8px">${[[1,"🌱 רק מתחילים","יחידה 1 – האותיות הראשונות"],[2,"🌹 למדנו כמה אותיות","ا ب ت ث ن ي כבר מוכרות"],[3,"🐪 למדנו בערך חצי","עד ر ز و + תנועות ארוכות"],[5,"🌙 כמעט כל האותיות","עד ص ض ط ظ"],[6,"👋 סיימנו את האותיות","עוברים למילים ומשפטים"]].map(([n,t,s])=>`<button class="opt" style="text-align:right;min-height:auto;${data.start===n?"border-color:var(--teal2);background:#e6f6f3":""}" onclick="_ob.start=${n};onboarding(2,_ob)"><b>${t}</b><br><small class="muted">${s}</small></button>`).join("")}</div>
    <div class="sp"></div><button class="btn block gold" onclick="finishOnboarding()">🚀 יוצאים למסע!</button>`);
}
function finishOnboarding(){ const d=window._ob; S.name=(d.name||"").trim().slice(0,20); S.gender=d.gender; S.goal=d.goal; S.unlocked=d.start; S.onboarded=true; save(); closeModal(); confetti(160); SFX.lvl(); route(); }

/* ---------------- init ---------------- */
load(); ensureDay(); checkStreak(); route();
if(!S.onboarded) onboarding(0);
</script>
