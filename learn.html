let currentUnit = 'all';
let currentSearch = '';
let englishVoice = null;
let isPlayingAll = false;
let playAllQueue = [];
let playAllIndex = 0;

const ttsSupported = 'speechSynthesis' in window;
if (!ttsSupported) document.getElementById('ttsWarn').style.display = 'block';

function loadVoices() {
  if (!ttsSupported) return;
  const voices = window.speechSynthesis.getVoices();
  englishVoice = voices.find(v => v.lang === 'en-US' && /female|samantha|karen|google/i.test(v.name))
              || voices.find(v => v.lang === 'en-US')
              || voices.find(v => v.lang.startsWith('en'));
}
if (ttsSupported) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text, onEnd) {
  if (!ttsSupported) { if (onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.85;
  u.pitch = 1.0;
  if (englishVoice) u.voice = englishVoice;
  if (onEnd) u.onend = onEnd;
  window.speechSynthesis.speak(u);
}

function getFiltered() {
  const result = {};
  const units = currentUnit === 'all' ? [1,2,3] : [parseInt(currentUnit)];
  const q = currentSearch.toLowerCase().trim();
  units.forEach(u => {
    const filtered = VOCAB[u].filter(w => {
      if (!q) return true;
      return w.en.toLowerCase().includes(q) || w.he.includes(q) || w.tr.includes(q);
    });
    if (filtered.length) result[u] = filtered;
  });
  return result;
}

function render() {
  const data = getFiltered();
  const content = document.getElementById('content');
  const stats = document.getElementById('stats');
  let total = 0;
  Object.values(data).forEach(arr => total += arr.length);
  stats.textContent = total ? `${total} מילים` : '';

  if (total === 0) {
    content.innerHTML = '<div class="empty">😕 לא נמצאו מילים</div>';
    return;
  }

  let html = '';
  Object.keys(data).forEach(unit => {
    html += `<div class="unit-section"><div class="unit-title">📚 יחידה ${unit}</div><div class="grid">`;
    data[unit].forEach((w, i) => {
      html += `<div class="card" data-en="${escapeAttr(w.en)}" data-key="${unit}-${i}">
        <button class="speaker-btn" aria-label="השמע">🔊</button>
        <div class="card-left">
          <div class="english">${escapeHtml(w.en)}</div>
          <div class="translit">${escapeHtml(w.tr)}</div>
        </div>
        <div class="hebrew">${escapeHtml(w.he)}</div>
      </div>`;
    });
    html += '</div></div>';
  });
  content.innerHTML = html;

  document.querySelectorAll('.card').forEach(card => {
    const btn = card.querySelector('.speaker-btn');
    const en = card.dataset.en;
    const handler = (e) => {
      e.stopPropagation();
      if (isPlayingAll) stopPlayAll();
      btn.classList.add('speaking');
      speak(en, () => btn.classList.remove('speaking'));
    };
    btn.addEventListener('click', handler);
    card.addEventListener('click', handler);
  });
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return s.replace(/"/g, '&quot;'); }

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentUnit = tab.dataset.unit;
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value;
  render();
});

const playAllBtn = document.getElementById('playAll');
playAllBtn.addEventListener('click', () => {
  if (isPlayingAll) { stopPlayAll(); return; }
  startPlayAll();
});

function startPlayAll() {
  if (!ttsSupported) return;
  const cards = Array.from(document.querySelectorAll('.card'));
  if (!cards.length) return;
  playAllQueue = cards;
  playAllIndex = 0;
  isPlayingAll = true;
  playAllBtn.textContent = '⏹ עצור';
  playAllBtn.classList.add('playing');
  playNext();
}

function stopPlayAll() {
  isPlayingAll = false;
  window.speechSynthesis.cancel();
  document.querySelectorAll('.speaker-btn.speaking').forEach(b => b.classList.remove('speaking'));
  document.querySelectorAll('.card.highlight').forEach(c => c.classList.remove('highlight'));
  playAllBtn.textContent = '🔊 השמע הכל';
  playAllBtn.classList.remove('playing');
}

function playNext() {
  if (!isPlayingAll || playAllIndex >= playAllQueue.length) {
    stopPlayAll();
    return;
  }
  const card = playAllQueue[playAllIndex];
  const btn = card.querySelector('.speaker-btn');
  document.querySelectorAll('.card.highlight').forEach(c => c.classList.remove('highlight'));
  card.classList.add('highlight');
  btn.classList.add('speaking');
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  speak(card.dataset.en, () => {
    btn.classList.remove('speaking');
    playAllIndex++;
    setTimeout(playNext, 300);
  });
}

render();
</script>
